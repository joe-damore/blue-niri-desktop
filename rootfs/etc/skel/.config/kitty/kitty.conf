# Disable confirm on close
confirm_os_window_close 0

# Long scrollback
scrollback_lines    10000

# Enable custom prompt logic that involves Kitten commands.
# This enables e.g. automatically changing terminal colors when in Distrobox,
# dynamic window/tab titles, etc.
env KITTY_ZSH_KITTEN_PROMPT=1

# Allow scripting
allow_remote_control yes
dynamic_background_opacity yes

# Font
font_family       FiraCode
bold_font         auto
italic_font       auto
bold_italic_font  auto

font_size         12

# Key Binds
include keybinds.conf

tab_bar_edge   top
tab_bar_style  slant

touch_scroll_multiplier   7.0

# Theme
include default_theme.conf

# Window padding
window_padding_width   2 5
